<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Prayer Reader — Design Preview</title><style>
:root{--navy:#0d2746;--gold:#d5a44c;--cream:#fff9ef;--ink:#11233e}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{display:flex;flex-direction:column;background:var(--cream);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
header{flex:0 0 auto;background:linear-gradient(120deg,#081e38,#0e2b4c 70%,#071c35);color:#f6d38c;border-bottom:2px solid var(--gold);height:66px;display:grid;grid-template-columns:78px minmax(0,1fr) 52px;align-items:center;padding:0 10px;gap:3px;box-shadow:0 2px 4px #071b3030}
header button{color:#f6d38c;background:transparent;border:0;font:600 13px Georgia;cursor:pointer;padding:8px 2px}header #bookmark{font-size:27px;text-align:center}header #back{text-align:left}
.brand{display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;min-width:0}.cross{font:normal 31px/1 Georgia,serif;color:#f3c86e;text-shadow:0 1px 1px #533919,0 0 5px #9e7535}.wordmark{font:bold clamp(10px,3vw,13px) Georgia;letter-spacing:.11em;color:#f4d28d;text-shadow:0 1px 3px #07172a}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 10px 20px}
.heading{text-align:center;padding:10px 0 9px}.heading h1{font-size:clamp(27px,7.4vw,34px);line-height:1.06;margin:0;font-weight:700}.heading p{font-size:clamp(20px,5.4vw,25px);font-style:italic;margin:2px 0 0}.flourish{color:#c18e35;font-size:15px;margin-top:3px}
.columns,.verse{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:12px}.columns{background:#eee5d8;border-radius:7px;padding:8px 10px;font:bold 12px system-ui;letter-spacing:.08em;text-align:center}.verse{border-bottom:1px solid #d9cebc;padding:11px 6px;align-items:start}.verse>div{font-size:clamp(17px,4.6vw,20px);line-height:1.32;overflow-wrap:break-word}.verse .latin{font-weight:700;font-style:normal}.verse:first-of-type{background:#fff0c9;border:1px solid #d9a84e;border-radius:8px;margin-top:3px}
footer{flex:0 0 auto;background:linear-gradient(120deg,#081e38,#0e2b4c);border-top:2px solid var(--gold);padding:5px 6px calc(5px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;box-shadow:0 -2px 7px #091b3320}
footer button{color:#f5dba5;background:transparent;border:0;border-right:1px solid #b99761;font:600 clamp(9px,2.55vw,12px) Georgia;min-height:48px;padding:4px 2px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}footer button:last-child{border:0}footer button .ico{font:normal 21px/1 Georgia;color:#f5dba5}footer button[aria-pressed=true]{color:#f7d384;background:#173657;border-radius:7px}footer button[aria-pressed=true] .ico{color:#f7d384}
.drawer{position:absolute;inset:auto 10px calc(65px + env(safe-area-inset-bottom)) 10px;background:#fff9ef;border:2px solid var(--gold);border-radius:12px;padding:15px;box-shadow:0 5px 22px #0004;max-height:55vh;overflow:auto;z-index:3}.drawer[hidden]{display:none}.drawer h2{margin:0 0 9px;font-size:21px}.drawer p{font:15px/1.5 Georgia;margin:7px 0}.drawer button{padding:9px 12px;border-radius:7px;border:1px solid var(--gold);background:var(--navy);color:white;margin-top:7px}
@media(max-width:350px){header{grid-template-columns:55px 1fr 45px}.wordmark{font-size:9px}.cross{font-size:25px}.columns,.verse{column-gap:8px}.verse{padding:9px 3px}}
</style></head><body>
<header><button id="back" aria-label="Back to prayers">‹ Prayers</button><div class="brand"><span class="cross" aria-label="Cross">✝︎</span><span class="wordmark">ORATIO • LATINA</span></div><button id="bookmark" aria-label="Bookmark prayer">☆</button></header>
<main><div class="heading"><h1>Our Father</h1><p>Pater Noster</p><div class="flourish">✦</div></div><div class="columns"><span>LATIN</span><span>ENGLISH</span></div><div id="verses"></div></main>
<footer><button id="pron"><span class="ico" aria-hidden="true">◖))</span><span>Pronunciation</span></button><button id="practice"><span class="ico" aria-hidden="true">◇</span><span>Practice</span></button><button id="learn"><span class="ico" aria-hidden="true">✓</span><span>Learned</span></button><button id="notes"><span class="ico" aria-hidden="true">▤</span><span>Notes</span></button></footer>
<section class="drawer" id="drawer" hidden aria-live="polite"><h2 id="drawerTitle"></h2><div id="drawerBody"></div><button id="close">Close</button></section>
<script>const prayers=[
{id:"sign",name:"Sign of the Cross",latin:"Signum Crucis",lines:[["In nomine Patris, et Filii,","In the name of the Father, and of the Son,"],["et Spiritus Sancti. Amen.","and of the Holy Spirit. Amen."]],phon:["Een NOH-mee-neh PAH-trees, et FEE-lee-ee,","et SPEE-ree-toos SAHNK-tee. AH-men."]},
{id:"pater",name:"Our Father",latin:"Pater Noster",lines:[["Pater noster, qui es in caelis,","Our Father, who art in heaven,"],["sanctificetur nomen tuum.","hallowed be thy name."],["Adveniat regnum tuum.","Thy kingdom come."],["Fiat voluntas tua, sicut in caelo et in terra.","Thy will be done on earth as it is in heaven."],["Panem nostrum quotidianum da nobis hodie,","Give us this day our daily bread,"],["et dimitte nobis debita nostra,","and forgive us our trespasses,"],["sicut et nos dimittimus debitoribus nostris.","as we forgive those who trespass against us."],["Et ne nos inducas in tentationem,","And lead us not into temptation,"],["sed libera nos a malo. Amen.","but deliver us from evil. Amen."]],phon:["PAH-ter NOHS-ter, kwee es een CHEH-lees,","sahnk-tee-fee-CHEH-toor NOH-men TOO-oom.","ahd-VEH-nee-aht REH-nyoom TOO-oom.","FEE-aht voh-LOON-tahs TOO-ah, SEE-koot een CHEH-loh et een TEHR-rah.","PAH-nem NOHS-troom kwoh-tee-dee-AH-noom dah NOH-bees OH-dee-eh,","et dee-MEET-teh NOH-bees DEH-bee-tah NOHS-trah,","SEE-koot et nohs dee-MEET-tee-moos deh-bee-TOH-ree-boos NOHS-trees.","Et neh nohs een-DOO-kahs een ten-tah-tsee-OH-nem,","sed LEE-beh-rah nohs ah MAH-loh. AH-men."]},
{id:"ave",name:"Hail Mary",latin:"Ave Maria",lines:[["Ave Maria, gratia plena, Dominus tecum.","Hail Mary, full of grace, the Lord is with thee."],["Benedicta tu in mulieribus,","Blessed art thou among women,"],["et benedictus fructus ventris tui, Iesus.","and blessed is the fruit of thy womb, Jesus."],["Sancta Maria, Mater Dei,","Holy Mary, Mother of God,"],["ora pro nobis peccatoribus,","pray for us sinners,"],["nunc et in hora mortis nostrae. Amen.","now and at the hour of our death. Amen."]],phon:["AH-veh mah-REE-ah, GRAH-tsee-ah PLEH-nah, DOH-mee-noos TEH-koom.","beh-neh-DEEK-tah too een moo-lee-EH-ree-boos,","et beh-neh-DEEK-toos FROOK-toos VEN-trees TOO-ee, YEH-soos.","SAHNK-tah mah-REE-ah, MAH-ter DEH-ee,","OH-rah proh NOH-bees pek-kah-TOH-ree-boos,","noonk et een OH-rah MOR-tees NOHS-treh. AH-men."]},
{id:"gloria",name:"Glory Be",latin:"Gloria Patri",lines:[["Gloria Patri, et Filio, et Spiritui Sancto.","Glory be to the Father, and to the Son, and to the Holy Spirit."],["Sicut erat in principio, et nunc, et semper,","As it was in the beginning, is now, and ever shall be,"],["et in saecula saeculorum. Amen.","world without end. Amen."]],phon:["GLOH-ree-ah PAH-tree, et FEE-lee-oh, et spee-REE-too-ee SAHNK-toh.","SEE-koot EH-raht een preen-CHEE-pee-oh, et noonk, et SEM-per,","et een SEH-koo-lah seh-koo-LOH-room. AH-men."]},
{id:"blessing",name:"Concluding Blessing",latin:"Dominus nos benedicat",lines:[["Dominus nos benedicat,","May the Lord bless us,"],["et ab omni malo defendat,","protect us from all evil,"],["et ad vitam perducat aeternam. Amen.","and bring us to everlasting life. Amen."]],phon:["DOH-mee-noos nohs beh-NEH-dee-kaht,","et ahb OHM-nee MAH-loh deh-FEN-daht,","et ahd VEE-tahm per-DOO-kaht eh-TEHR-nahm. AH-men."]},
{id:"requiem",name:"Eternal Rest",latin:"Requiem aeternam",lines:[["Requiem aeternam dona eis, Domine,","Eternal rest grant unto them, O Lord,"],["et lux perpetua luceat eis.","and let perpetual light shine upon them."],["Requiescant in pace. Amen.","May they rest in peace. Amen."]],phon:["REH-kwee-em eh-TEHR-nahm DOH-nah EH-ees, DOH-mee-neh,","et looks per-PEH-too-ah LOO-cheh-aht EH-ees.","reh-kwee-EH-skahnt een PAH-cheh. AH-men."]},
{"id":"creed","name":"Apostles' Creed","latin":"Symbolum Apostolorum","lines":[["Credo in Deum, Patrem omnipotentem, Creatorem caeli et terrae.","I believe in God, the Father almighty, Creator of heaven and earth."],["Et in Iesum Christum, Filium eius unicum, Dominum nostrum,","And in Jesus Christ, his only Son, our Lord,"],["qui conceptus est de Spiritu Sancto, natus ex Maria Virgine,","who was conceived by the Holy Spirit, born of the Virgin Mary,"],["passus sub Pontio Pilato, crucifixus, mortuus, et sepultus,","suffered under Pontius Pilate, was crucified, died, and was buried;"],["descendit ad inferos, tertia die resurrexit a mortuis,","he descended into hell; on the third day he rose again from the dead;"],["ascendit ad caelos, sedet ad dexteram Dei Patris omnipotentis,","he ascended into heaven, and is seated at the right hand of God the Father almighty;"],["inde venturus est iudicare vivos et mortuos.","from there he will come to judge the living and the dead."],["Credo in Spiritum Sanctum, sanctam Ecclesiam catholicam,","I believe in the Holy Spirit, the holy catholic Church,"],["sanctorum communionem, remissionem peccatorum,","the communion of saints, the forgiveness of sins,"],["carnis resurrectionem, vitam aeternam. Amen.","the resurrection of the body, and life everlasting. Amen."]],"phon":[],"phonNote":"Pronunciation guide pending editorial verification."},
{"id":"salve","name":"Hail, Holy Queen","latin":"Salve Regina","lines":[["Salve, Regina, mater misericordiae,","Hail, Holy Queen, Mother of mercy,"],["vita, dulcedo, et spes nostra, salve.","our life, our sweetness, and our hope."],["Ad te clamamus, exsules filii Hevae.","To thee do we cry, poor banished children of Eve."],["Ad te suspiramus, gementes et flentes in hac lacrimarum valle.","To thee do we send up our sighs, mourning and weeping in this valley of tears."],["Eia ergo, advocata nostra, illos tuos misericordes oculos ad nos converte.","Turn then, most gracious advocate, thine eyes of mercy toward us."],["Et Iesum, benedictum fructum ventris tui, nobis post hoc exsilium ostende.","And after this our exile, show unto us the blessed fruit of thy womb, Jesus."],["O clemens, O pia, O dulcis Virgo Maria.","O clement, O loving, O sweet Virgin Mary."]],"phon":[],"phonNote":"Pronunciation guide pending editorial verification."},
{"id":"opening","name":"Liturgy of the Hours Opening","latin":"Deus, in adiutorium","lines":[["Deus, in adiutorium meum intende.","O God, come to my assistance."],["Domine, ad adiuvandum me festina.","O Lord, make haste to help me."],["Gloria Patri, et Filio, et Spiritui Sancto.","Glory be to the Father, and to the Son, and to the Holy Spirit."],["Sicut erat in principio, et nunc, et semper,","As it was in the beginning, is now, and ever shall be,"],["et in saecula saeculorum. Amen.","world without end. Amen."]],"phon":[],"phonNote":"Pronunciation guide pending editorial verification."},
{"id":"magnificat","name":"Canticle of Mary","latin":"Magnificat","lines":[["Magnificat anima mea Dominum,","My soul proclaims the greatness of the Lord,"],["et exsultavit spiritus meus in Deo salutari meo.","and my spirit rejoices in God my Savior."],["Quia respexit humilitatem ancillae suae.","For he has looked with favor on his lowly servant."],["Ecce enim ex hoc beatam me dicent omnes generationes.","From this day all generations will call me blessed."],["Quia fecit mihi magna qui potens est, et sanctum nomen eius.","The Almighty has done great things for me, and holy is his name."],["Et misericordia eius a progenie in progenies timentibus eum.","He has mercy on those who fear him in every generation."],["Fecit potentiam in brachio suo, dispersit superbos mente cordis sui.","He has shown the strength of his arm and scattered the proud in their conceit."],["Deposuit potentes de sede et exaltavit humiles.","He has cast down the mighty from their thrones and has lifted up the lowly."],["Esurientes implevit bonis et divites dimisit inanes.","He has filled the hungry with good things, and the rich he has sent away empty."],["Suscepit Israel puerum suum, recordatus misericordiae suae,","He has come to the help of his servant Israel, remembering his promise of mercy,"],["sicut locutus est ad patres nostros, Abraham et semini eius in saecula.","the promise he made to our fathers, to Abraham and his children forever."]],"phon":[],"phonNote":"Pronunciation guide pending editorial verification."},
{"id":"benedictus","name":"Canticle of Zechariah","latin":"Benedictus","lines":[["Benedictus Dominus Deus Israel, quia visitavit et fecit redemptionem plebi suae,","Blessed be the Lord, the God of Israel; he has come to his people and set them free."],["et erexit cornu salutis nobis in domo David pueri sui,","He has raised up for us a mighty savior, born of the house of his servant David."],["sicut locutus est per os sanctorum, qui a saeculo sunt, prophetarum eius,","Through his holy prophets he promised of old"],["salutem ex inimicis nostris et de manu omnium qui oderunt nos,","that he would save us from our enemies, from the hands of all who hate us."],["ad faciendam misericordiam cum patribus nostris et memorari testamenti sui sancti,","He promised to show mercy to our fathers and to remember his holy covenant."],["iusiurandum quod iuravit ad Abraham patrem nostrum, daturum se nobis,","This was the oath he swore to our father Abraham:"],["ut sine timore, de manu inimicorum liberati, serviamus illi","to set us free from the hands of our enemies, free to worship him without fear,"],["in sanctitate et iustitia coram ipso omnibus diebus nostris.","holy and righteous in his sight all the days of our life."],["Et tu, puer, propheta Altissimi vocaberis: praeibis enim ante faciem Domini parare vias eius,","You, my child, shall be called the prophet of the Most High; for you will go before the Lord to prepare his way,"],["ad dandam scientiam salutis plebi eius in remissionem peccatorum eorum,","to give his people knowledge of salvation by the forgiveness of their sins."],["per viscera misericordiae Dei nostri, in quibus visitabit nos oriens ex alto,","In the tender compassion of our God the dawn from on high shall break upon us,"],["illuminare his qui in tenebris et in umbra mortis sedent, ad dirigendos pedes nostros in viam pacis.","to shine on those who dwell in darkness and the shadow of death, and to guide our feet into the way of peace."]],"phon":[],"phonNote":"Pronunciation guide pending editorial verification."},
{"id":"nunc","name":"Canticle of Simeon","latin":"Nunc Dimittis","lines":[["Nunc dimittis servum tuum, Domine, secundum verbum tuum in pace,","Lord, now you let your servant go in peace; your word has been fulfilled."],["quia viderunt oculi mei salutare tuum,","My own eyes have seen the salvation"],["quod parasti ante faciem omnium populorum,","which you have prepared in the sight of every people:"],["lumen ad revelationem gentium et gloriam plebis tuae Israel.","a light to reveal you to the nations and the glory of your people Israel."]],"phon":[],"phonNote":"Pronunciation guide pending editorial verification."}
];
const p=prayers.find(x=>x.id==="pater");const escapeHtml=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));document.getElementById("verses").innerHTML=p.lines.map(([l,e])=>'<div class="verse"><div class="latin" lang="la">'+escapeHtml(l)+'</div><div>'+escapeHtml(e)+'</div></div>').join("");
const KEY="latinPrayerCompanion.v1";let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch{}saved.learned??=[];saved.favorites??=[];const store=()=>localStorage.setItem(KEY,JSON.stringify(saved));const drawer=document.getElementById("drawer");const show=(title,content)=>{document.getElementById("drawerTitle").textContent=title;document.getElementById("drawerBody").innerHTML=content;drawer.hidden=false};document.getElementById("close").onclick=()=>drawer.hidden=true;
const sync=()=>{document.getElementById("learn").setAttribute("aria-pressed",String(saved.learned.includes(p.id)));document.getElementById("bookmark").textContent=saved.favorites.includes(p.id)?"★":"☆"};sync();
document.getElementById("learn").onclick=()=>{saved.learned=saved.learned.includes(p.id)?saved.learned.filter(x=>x!==p.id):[...saved.learned,p.id];store();sync()};
document.getElementById("bookmark").onclick=()=>{saved.favorites=saved.favorites.includes(p.id)?saved.favorites.filter(x=>x!==p.id):[...saved.favorites,p.id];store();sync()};
document.getElementById("pron").onclick=()=>show("Pronunciation",'<p>Approximate Ecclesiastical Latin pronunciation. Audio recordings have not been verified.</p>'+p.phon.map(x=>'<p>'+escapeHtml(x)+'</p>').join(""));
document.getElementById("practice").onclick=()=>show("Practice",'<p>Practice mode remains available in the main app. This isolated preview focuses on the approved reader layout.</p>');
document.getElementById("notes").onclick=()=>show("Notes",'<p>Notes are a proposed feature, not yet implemented. No notes have been saved.</p>');
document.getElementById("back").onclick=()=>show("Reader preview",'<p>This isolated preview displays Our Father. Return to the main app to browse all prayers.</p>');
</script></body></html>
