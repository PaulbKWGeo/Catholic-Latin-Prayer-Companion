<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14283b"><meta name="description" content="Learn Catholic prayers in Ecclesiastical Latin"><title>Latin Prayer Companion</title><link rel="manifest" href="./manifest.webmanifest"><style>
:root{font-family:Georgia,"Times New Roman",serif;color:#1b2b36;background:#f7f3eb}*{box-sizing:border-box}body{margin:0}header{background:#14283b;color:#f8f1df;padding:24px 20px 19px;text-align:center}header .eyebrow{color:#d6b675;font:600 11px system-ui;letter-spacing:.22em;text-transform:uppercase}h1{font-size:clamp(25px,5vw,37px);font-weight:normal;margin:8px 0}header p{margin:0;color:#c8d1d6;font-size:14px}nav{display:flex;justify-content:center;background:#1c3449;position:sticky;top:0;z-index:2}nav button{flex:1;max-width:180px;border:0;border-bottom:3px solid transparent;color:#e3e8ea;background:none;padding:15px 5px;font:600 13px system-ui}nav button[aria-selected=true]{border-color:#d6b675;color:#fff}main{max-width:850px;margin:auto;padding:20px 16px 75px}.intro{color:#53616b;font-size:15px;line-height:1.5}.prayer-list{display:grid;gap:10px}.prayer-button,.panel{background:#fffdf8;border:1px solid #dfd8ca;border-radius:12px;box-shadow:0 3px 12px #182e3910}.prayer-button{width:100%;padding:17px;text-align:left;color:#1b2b36;display:flex;align-items:center;justify-content:space-between;cursor:pointer}.prayer-button strong{font-size:19px;font-weight:normal}.prayer-button small{display:block;color:#63717b;font:12px system-ui;margin-top:5px}.panel{padding:20px;margin-top:15px}.back{border:0;background:none;color:#315b78;font:600 14px system-ui;padding:5px 0 15px;cursor:pointer}.section-title{font-size:27px;font-weight:normal;margin:0 0 5px}.subtitle{color:#65727a;font-size:14px;margin:0 0 20px}.pairs{border:1px solid #e2d9c7;border-radius:8px;overflow:hidden}.pair{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #e8e0d3}.pair:last-child{border:0}.pair>div{padding:12px;line-height:1.5}.pair>div+div{border-left:2px solid #c3a66e;background:#fbf8f1}.pair.heading{background:#f0e8d9;font:700 12px system-ui;letter-spacing:.07em;text-transform:uppercase}.pair.heading>div{padding:9px 12px}.pronunciation{margin-top:24px;background:#f7f2e7;border-radius:8px;padding:16px}.pronunciation h3{margin:0 0 10px;font-size:18px;font-weight:normal}.pronunciation p{line-height:1.8;margin:0;font-size:15px}.hint{font:13px/1.5 system-ui;color:#63717b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:17px}button.action{border:1px solid #b5a68c;border-radius:8px;padding:12px 14px;background:#fffdf8;color:#1b2b36;font:600 13px system-ui;cursor:pointer}button.primary{background:#17374d;color:white;border-color:#17374d}button:focus-visible{outline:3px solid #b78d3f;outline-offset:2px}.card{min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;border:2px solid #d5c5a8;border-radius:12px;background:#fffdf8;font-size:23px;line-height:1.4;cursor:pointer}.card small{display:block;font:12px system-ui;color:#65727a;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stat{background:#fffdf8;border:1px solid #dfd8ca;border-radius:12px;padding:18px;text-align:center}.stat strong{display:block;font-size:32px;color:#18394f}.stat span{font:13px system-ui;color:#596773}.empty{padding:20px;text-align:center;color:#65727a}.audio{margin-top:16px;border-top:1px solid #e4dac9;padding-top:15px}.audio a{color:#1b5478}.progress-note{font:12px/1.5 system-ui;color:#6b757a;margin-top:14px}@media(max-width:520px){main{padding:15px 12px 70px}.pair>div{font-size:14px;padding:10px}.panel{padding:15px}header{padding:20px 12px 17px}}@media(prefers-reduced-motion:no-preference){button{transition:background .15s}}
</style></head><body><header><div class="eyebrow">✦ Oratio et Disciplina ✦</div><h1>Catholic Latin Prayer Companion</h1><p>Pray • Listen • Learn • Remember</p></header><nav aria-label="Main navigation"><button data-tab="library" aria-selected="true">Prayers</button><button data-tab="practice" aria-selected="false">Practice</button><button data-tab="progress" aria-selected="false">Progress</button></nav><main id="app"></main><script>
const prayers=[
{id:"sign",name:"Sign of the Cross",latin:"Signum Crucis",lines:[["In nomine Patris, et Filii,","In the name of the Father, and of the Son,"],["et Spiritus Sancti. Amen.","and of the Holy Spirit. Amen."]],phon:["Een NOH-mee-neh PAH-trees, et FEE-lee-ee,","et SPEE-ree-toos SAHNK-tee. AH-men."]},
{id:"pater",name:"Our Father",latin:"Pater Noster",lines:[["Pater noster, qui es in caelis,","Our Father, who art in heaven,"],["sanctificetur nomen tuum.","hallowed be thy name."],["Adveniat regnum tuum.","Thy kingdom come."],["Fiat voluntas tua, sicut in caelo et in terra.","Thy will be done on earth as it is in heaven."],["Panem nostrum quotidianum da nobis hodie,","Give us this day our daily bread,"],["et dimitte nobis debita nostra,","and forgive us our trespasses,"],["sicut et nos dimittimus debitoribus nostris.","as we forgive those who trespass against us."],["Et ne nos inducas in tentationem,","And lead us not into temptation,"],["sed libera nos a malo. Amen.","but deliver us from evil. Amen."]],phon:["PAH-ter NOHS-ter, kwee es een CHEH-lees,","sahnk-tee-fee-CHEH-toor NOH-men TOO-oom.","ahd-VEH-nee-aht REH-nyoom TOO-oom.","FEE-aht voh-LOON-tahs TOO-ah, SEE-koot een CHEH-loh et een TEHR-rah.","PAH-nem NOHS-troom kwoh-tee-dee-AH-noom dah NOH-bees OH-dee-eh,","et dee-MEET-teh NOH-bees DEH-bee-tah NOHS-trah,","SEE-koot et nohs dee-MEET-tee-moos deh-bee-TOH-ree-boos NOHS-trees.","Et neh nohs een-DOO-kahs een ten-tah-tsee-OH-nem,","sed LEE-beh-rah nohs ah MAH-loh. AH-men."]},
{id:"ave",name:"Hail Mary",latin:"Ave Maria",lines:[["Ave Maria, gratia plena, Dominus tecum.","Hail Mary, full of grace, the Lord is with thee."],["Benedicta tu in mulieribus,","Blessed art thou among women,"],["et benedictus fructus ventris tui, Iesus.","and blessed is the fruit of thy womb, Jesus."],["Sancta Maria, Mater Dei,","Holy Mary, Mother of God,"],["ora pro nobis peccatoribus,","pray for us sinners,"],["nunc et in hora mortis nostrae. Amen.","now and at the hour of our death. Amen."]],phon:["AH-veh mah-REE-ah, GRAH-tsee-ah PLEH-nah, DOH-mee-noos TEH-koom.","beh-neh-DEEK-tah too een moo-lee-EH-ree-boos,","et beh-neh-DEEK-toos FROOK-toos VEN-trees TOO-ee, YEH-soos.","SAHNK-tah mah-REE-ah, MAH-ter DEH-ee,","OH-rah proh NOH-bees pek-kah-TOH-ree-boos,","noonk et een OH-rah MOR-tees NOHS-treh. AH-men."]},
{id:"gloria",name:"Glory Be",latin:"Gloria Patri",lines:[["Gloria Patri, et Filio, et Spiritui Sancto.","Glory be to the Father, and to the Son, and to the Holy Spirit."],["Sicut erat in principio, et nunc, et semper,","As it was in the beginning, is now, and ever shall be,"],["et in saecula saeculorum. Amen.","world without end. Amen."]],phon:["GLOH-ree-ah PAH-tree, et FEE-lee-oh, et spee-REE-too-ee SAHNK-toh.","SEE-koot EH-raht een preen-CHEE-pee-oh, et noonk, et SEM-per,","et een SEH-koo-lah seh-koo-LOH-room. AH-men."]},
{id:"blessing",name:"Concluding Blessing",latin:"Dominus nos benedicat",lines:[["Dominus nos benedicat,","May the Lord bless us,"],["et ab omni malo defendat,","protect us from all evil,"],["et ad vitam perducat aeternam. Amen.","and bring us to everlasting life. Amen."]],phon:["DOH-mee-noos nohs beh-NEH-dee-kaht,","et ahb OHM-nee MAH-loh deh-FEN-daht,","et ahd VEE-tahm per-DOO-kaht eh-TEHR-nahm. AH-men."]},
{id:"requiem",name:"Eternal Rest",latin:"Requiem aeternam",lines:[["Requiem aeternam dona eis, Domine,","Eternal rest grant unto them, O Lord,"],["et lux perpetua luceat eis.","and let perpetual light shine upon them."],["Requiescant in pace. Amen.","May they rest in peace. Amen."]],phon:["REH-kwee-em eh-TEHR-nahm DOH-nah EH-ees, DOH-mee-neh,","et looks per-PEH-too-ah LOO-cheh-aht EH-ees.","reh-kwee-EH-skahnt een PAH-cheh. AH-men."]}
];
const KEY="latinPrayerCompanion.v1";let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch{};saved.learned??=[];saved.known??={};saved.sessions??=0;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch{}};
const app=document.getElementById("app");let tab="library",current=null,mode="latin",index=0,reveal=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));if(tab==="library")return library();if(tab==="practice")return practice();progress()}
function library(){if(!current){app.innerHTML='<p class="intro">Learn familiar Catholic prayers in Ecclesiastical Latin, one phrase at a time.</p><div class="prayer-list">'+prayers.map(p=>'<button class="prayer-button" data-open="'+p.id+'"><span><strong>'+esc(p.latin)+'</strong><small>'+esc(p.name)+'</small></span><span aria-hidden="true">›</span></button>').join("")+'</div>';app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{current=b.dataset.open;render()});return}
const p=prayers.find(p=>p.id===current);app.innerHTML='<button class="back" id="back">← All prayers</button><section class="panel"><h2 class="section-title">'+esc(p.latin)+'</h2><p class="subtitle">'+esc(p.name)+'</p><div class="pairs"><div class="pair heading"><div>Latin</div><div>English</div></div>'+p.lines.map(([l,e])=>'<div class="pair"><div lang="la">'+esc(l)+'</div><div>'+esc(e)+'</div></div>').join("")+'</div><div class="pronunciation"><h3>Pronunciation</h3><p class="hint">Approximate Ecclesiastical Latin sounds. Read each line in order.</p>'+p.phon.map(x=>'<p>'+esc(x)+'</p>').join("")+'</div><div class="audio"><strong>Human audio</strong><p class="hint">A prayer-specific human recording has not yet been verified for this entry. No synthetic audio is used.</p></div><div class="actions"><button class="action primary" id="learn">'+(saved.learned.includes(p.id)?"✓ Learned — tap to undo":"Mark as learned")+'</button><button class="action" id="startPractice">Practice this prayer</button></div></section>';document.getElementById("back").onclick=()=>{current=null;render()};document.getElementById("learn").onclick=()=>{saved.learned=saved.learned.includes(p.id)?saved.learned.filter(x=>x!==p.id):[...saved.learned,p.id];persist();render()};document.getElementById("startPractice").onclick=()=>{tab="practice";mode="latin";index=0;reveal=false;render()}}
function practice(){const p=prayers.find(x=>x.id===current)||prayers[0];index=Math.min(index,p.lines.length-1);const line=p.lines[index];app.innerHTML='<h2 class="section-title">Flashcard Practice</h2><p class="intro">Tap the card to reveal the translation. Switch directions to practice recalling Latin from English.</p><label class="hint" for="prayerSelect">Prayer</label><p><select id="prayerSelect" style="width:100%;padding:12px;border:1px solid #b5a68c;border-radius:8px;background:#fffdf8;font-size:16px">'+prayers.map(x=>'<option value="'+x.id+'" '+(x.id===p.id?"selected":"")+'>'+esc(x.latin)+'</option>').join("")+'</select></p><div class="actions"><button class="action '+(mode==="latin"?"primary":"")+'" id="latinFirst">Latin → English</button><button class="action '+(mode==="english"?"primary":"")+'" id="englishFirst">English → Latin</button></div><p class="hint">Card '+(index+1)+' of '+p.lines.length+'</p><button class="card" id="flip" style="width:100%" aria-label="Flip flashcard"><div><small>'+(reveal?"Answer — tap to flip back":"Question — tap to reveal")+'</small>'+esc(reveal?line[mode==="latin"?1:0]:line[mode==="latin"?0:1])+'</div></button><div class="actions"><button class="action" id="prev">← Previous</button><button class="action" id="next">Next →</button><button class="action primary" id="known">✓ I knew it</button></div><p class="progress-note">Practice is saved on this device only. Tap “I knew it” to record a successful recall.</p>';document.getElementById("prayerSelect").onchange=e=>{current=e.target.value;index=0;reveal=false;render()};document.getElementById("latinFirst").onclick=()=>{mode="latin";reveal=false;render()};document.getElementById("englishFirst").onclick=()=>{mode="english";reveal=false;render()};document.getElementById("flip").onclick=()=>{reveal=!reveal;render()};document.getElementById("prev").onclick=()=>{index=(index-1+p.lines.length)%p.lines.length;reveal=false;render()};document.getElementById("next").onclick=()=>{index=(index+1)%p.lines.length;reveal=false;render()};document.getElementById("known").onclick=()=>{saved.known[p.id+":"+index]=true;saved.sessions++;persist();index=(index+1)%p.lines.length;reveal=false;render()}}
function progress(){const total=prayers.reduce((n,p)=>n+p.lines.length,0);const known=Object.keys(saved.known).length;app.innerHTML='<h2 class="section-title">Your Learning Progress</h2><p class="intro">A simple record of your prayer practice, saved in this browser.</p><div class="stats"><div class="stat"><strong>'+saved.learned.length+'/'+prayers.length+'</strong><span>Prayers marked learned</span></div><div class="stat"><strong>'+known+'/'+total+'</strong><span>Flashcard phrases recalled</span></div><div class="stat"><strong>'+saved.sessions+'</strong><span>Successful recalls</span></div><div class="stat"><strong>'+Math.round(100*known/total)+'%</strong><span>Phrase coverage</span></div></div><p class="progress-note">This data does not sync between devices. Clearing browser data may erase it.</p><div class="actions"><button class="action" id="reset">Reset learning progress</button></div>';document.getElementById("reset").onclick=()=>{if(confirm("Erase all learning progress on this device?")){saved={learned:[],known:{},sessions:0};persist();render()}}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
