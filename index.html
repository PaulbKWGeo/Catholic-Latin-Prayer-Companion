{id:"gloria",name:"Glory Be",latin:"Gloria Patri",lines:[["Gloria Patri, et Filio, et Spiritui Sancto.","Glory be to the Father, and to the Son, and to the Holy Spirit."],["Sicut erat in principio, et nunc, et semper,","As it was in the beginning, is now, and ever shall be,"],["et in saecula saeculorum. Amen.","world without end. Amen."]],phon:["GLOH-ree-ah PAH-tree, et FEE-lee-oh, et spee-REE-too-ee SAHNK-toh.","SEE-koot EH-raht een preen-CHEE-pee-oh, et noonk, et SEM-per,","et een SEH-koo-lah seh-koo-LOH-room. AH-men."]},

{id:"requiem",name:"Eternal Rest",latin:"Requiem aeternam",lines:[["Requiem aeternam dona eis, Domine,","Eternal rest grant unto them, O Lord,"],["et lux perpetua luceat eis.","and let perpetual light shine upon them."],["Requiescant in pace. Amen.","May they rest in peace. Amen."]],phon:["REH-kwee-em eh-TEHR-nahm DOH-nah EH-ees, DOH-mee-neh,","et looks per-PEH-too-ah LOO-cheh-aht EH-ees.","reh-kwee-EH-skahnt een PAH-cheh. AH-men."]}

const KEY="latinPrayerCompanion.v1";let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||"{}")}catch{};saved.learned??=[];saved.known??={};saved.sessions??=0;saved.favorites??=[];saved.prefs??={font:18,stacked:false,pron:false};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(saved))}catch{}};
const app=document.getElementById("app");let tab="library",current=null,mode="latin",index=0,reveal=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){document.documentElement.style.setProperty("--prayer-size",saved.prefs.font+"px");document.body.classList.toggle("stacked",!!saved.prefs.stacked);const hp=prayers.find(p=>p.id===current);document.getElementById("heroPrayer").textContent=hp?.latin||"Catholic Latin Prayer Companion";document.getElementById("heroTranslation").textContent=hp?.name||"Pray • Learn • Remember";document.getElementById("bookmarkToggle").textContent=hp&&saved.favorites.includes(hp.id)?"★":"☆";document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));if(tab==="library")return library();if(tab==="practice")return practice();progress()}
function library(){if(!current){app.innerHTML='<p class="intro">Learn familiar Catholic prayers in Ecclesiastical Latin, one phrase at a time.</p><div class="prayer-list">'+prayers.map(p=>'<button class="prayer-button" data-open="'+p.id+'"><span><strong>'+esc(p.latin)+'</strong><small>'+esc(p.name)+'</small></span><span aria-hidden="true">›</span></button>').join("")+'</div>';app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{current=b.dataset.open;render()});return}
const p=prayers.find(p=>p.id===current);app.innerHTML='<button class="back" id="back">← All prayers</button><section class="panel"><h2 class="section-title">'+esc(p.latin)+'</h2><p class="subtitle">'+esc(p.name)+'</p><div class="pairs"><div class="pair heading"><div>Latin</div><div>English</div></div>'+p.lines.map(([l,e])=>'<div class="pair"><div lang="la">'+esc(l)+'</div><div>'+esc(e)+'</div></div>').join("")+'</div><details class="pronunciation" '+(saved.prefs.pron?'open':'')+'><summary>◖)) &nbsp; Pronunciation</summary><div class="pron-body"><p class="hint">Approximate Ecclesiastical Latin sounds. Read each line in order.</p>'+p.phon.map(x=>'<p>'+esc(x)+'</p>').join("")+'</div></details><div class="audio"><strong>Human audio</strong><p class="hint">A prayer-specific human recording has not yet been verified for this entry. No synthetic audio is used.</p></div><div class="actions"><button class="action primary" id="learn">'+(saved.learned.includes(p.id)?"✓ Learned — tap to undo":"Mark as learned")+'</button><button class="action" id="startPractice">📖 Practice Prayer</button></div></section>';document.getElementById("back").onclick=()=>{current=null;render()};document.getElementById("learn").onclick=()=>{saved.learned=saved.learned.includes(p.id)?saved.learned.filter(x=>x!==p.id):[...saved.learned,p.id];persist();render()};document.getElementById("startPractice").onclick=()=>{tab="practice";mode="latin";index=0;reveal=false;render()}}
function practice(){const p=prayers.find(x=>x.id===current)||prayers[0];index=Math.min(index,p.lines.length-1);const line=p.lines[index];app.innerHTML='<h2 class="section-title">Flashcard Practice</h2><p class="intro">Tap the card to reveal the translation. Switch directions to practice recalling Latin from English.</p><label class="hint" for="prayerSelect">Prayer</label><p><select id="prayerSelect" style="width:100%;padding:12px;border:1px solid #b5a68c;border-radius:8px;background:#fffdf8;font-size:16px">'+prayers.map(x=>'<option value="'+x.id+'" '+(x.id===p.id?"selected":"")+'>'+esc(x.latin)+'</option>').join("")+'</select></p><div class="actions"><button class="action '+(mode==="latin"?"primary":"")+'" id="latinFirst">Latin → English</button><button class="action '+(mode==="english"?"primary":"")+'" id="englishFirst">English → Latin</button></div><p class="hint">Card '+(index+1)+' of '+p.lines.length+'</p><button class="card" id="flip" style="width:100%" aria-label="Flip flashcard"><div><small>'+(reveal?"Answer — tap to flip back":"Question — tap to reveal")+'</small>'+esc(reveal?line[mode==="latin"?1:0]:line[mode==="latin"?0:1])+'</div></button><div class="actions"><button class="action" id="prev">← Previous</button><button class="action" id="next">Next →</button><button class="action primary" id="known">✓ I knew it</button></div><p class="progress-note">Practice is saved on this device only. Tap “I knew it” to record a successful recall.</p>';document.getElementById("prayerSelect").onchange=e=>{current=e.target.value;index=0;reveal=false;render()};document.getElementById("latinFirst").onclick=()=>{mode="latin";reveal=false;render()};document.getElementById("englishFirst").onclick=()=>{mode="english";reveal=false;render()};document.getElementById("flip").onclick=()=>{reveal=!reveal;render()};document.getElementById("prev").onclick=()=>{index=(index-1+p.lines.length)%p.lines.length;reveal=false;render()};document.getElementById("next").onclick=()=>{index=(index+1)%p.lines.length;reveal=false;render()};document.getElementById("known").onclick=()=>{saved.known[p.id+":"+index]=true;saved.sessions++;persist();index=(index+1)%p.lines.length;reveal=false;render()}}
function progress(){const total=prayers.reduce((n,p)=>n+p.lines.length,0);const known=Object.keys(saved.known).length;app.innerHTML='<h2 class="section-title">Your Learning Progress</h2><p class="intro">A simple record of your prayer practice, saved in this browser.</p><div class="stats"><div class="stat"><strong>'+saved.learned.length+'/'+prayers.length+'</strong><span>Prayers marked learned</span></div><div class="stat"><strong>'+known+'/'+total+'</strong><span>Flashcard phrases recalled</span></div><div class="stat"><strong>'+saved.sessions+'</strong><span>Successful recalls</span></div><div class="stat"><strong>'+Math.round(100*known/total)+'%</strong><span>Phrase coverage</span></div></div><p class="progress-note">This data does not sync between devices. Clearing browser data may erase it.</p><div class="actions"><button class="action" id="reset">Reset learning progress</button></div>';document.getElementById("reset").onclick=()=>{if(confirm("Erase all learning progress on this device?")){saved={learned:[],known:{},sessions:0,favorites:saved.favorites||[],prefs:saved.prefs||{font:18,stacked:false,pron:false}};persist();render()}}}
document.querySelectorAll("nav button[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.getElementById("mainNav").hidden=true;render()});document.getElementById("menuToggle").onclick=()=>{const n=document.getElementById("mainNav");n.hidden=!n.hidden;document.getElementById("menuToggle").setAttribute("aria-expanded",String(!n.hidden))};document.getElementById("settingsToggle").onclick=()=>{const x=document.getElementById("settingsPanel");x.hidden=!x.hidden};document.getElementById("bookmarkToggle").onclick=()=>{if(!current){alert("Open a prayer to bookmark it.");return}saved.favorites=saved.favorites.includes(current)?saved.favorites.filter(x=>x!==current):[...saved.favorites,current];persist();render()};document.getElementById("favoritesNav").onclick=()=>{tab="library";current=null;document.getElementById("mainNav").hidden=true;render();const favorites=prayers.filter(p=>saved.favorites.includes(p.id));const list=app.querySelector(".prayer-list");if(list){list.innerHTML=favorites.length?favorites.map(p=>'<button class="prayer-button" data-open="'+p.id+'"><span><strong>'+esc(p.latin)+'</strong><small>'+esc(p.name)+'</small></span><span>›</span></button>').join(""):'<p class="empty">No bookmarks yet. Open a prayer and tap ☆.</p>';list.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{current=b.dataset.open;render()})}};document.getElementById("fontRange").value=saved.prefs.font;document.getElementById("stackedToggle").checked=saved.prefs.stacked;document.getElementById("pronDefault").checked=saved.prefs.pron;document.getElementById("fontRange").oninput=e=>{saved.prefs.font=+e.target.value;persist();render()};document.getElementById("stackedToggle").onchange=e=>{saved.prefs.stacked=e.target.checked;persist();render()};document.getElementById("pronDefault").onchange=e=>{saved.prefs.pron=e.target.checked;persist();render()};render();
</script></body></html>
